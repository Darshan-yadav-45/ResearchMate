<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – ResearchMate Academic Agent</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  <style>
    body {
      background: linear-gradient(135deg, #0b1329 0%, #162347 50%, #0f62fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }
    .auth-header {
      padding: 32px 32px 20px 32px;
      text-align: center;
      border-bottom: 1px solid #f0f2f5;
    }
    .auth-body {
      padding: 28px 32px 32px 32px;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-primary-subtle text-primary mb-3">
        <i class="bi bi-mortarboard-fill fs-2"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">ResearchMate</h4>
      <p class="text-muted small mb-0">Academic Research Workspace</p>
    </div>

    <div class="auth-body">
      <!-- Flash Error Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            {% if category == 'danger' %}
            <div class="alert alert-danger alert-dismissible fade show small py-2 mb-3" role="alert">
              {{ message }}
              <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" id="login-form">
        <div class="mb-3">
          <label for="identity" class="form-label fw-semibold small text-secondary">Username or Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
            <input
              type="text"
              class="form-control border-start-0"
              id="identity"
              name="identity"
              placeholder="e.g. researcher"
              required
              autofocus
            >
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input
              type="password"
              class="form-control border-start-0"
              id="password"
              name="password"
              placeholder="Enter password"
              required
            >
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check small">
            <input class="form-check-input" type="checkbox" name="remember" id="remember" checked>
            <label class="form-check-label text-muted" for="remember">Remember me</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3 shadow-sm">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Workspace
        </button>
      </form>

      <div class="text-center pt-2 border-top">
        <small class="text-muted">
          New researcher?
          <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Create an Account</a>
        </small>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
