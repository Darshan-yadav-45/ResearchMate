<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – ResearchMate Academic Agent</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  <style>
    body {
      background: linear-gradient(135deg, #0b1329 0%, #162347 50%, #0f62fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
    }
    .auth-header {
      padding: 28px 32px 18px 32px;
      text-align: center;
      border-bottom: 1px solid #f0f2f5;
    }
    .auth-body {
      padding: 26px 32px 30px 32px;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-primary-subtle text-primary mb-2">
        <i class="bi bi-person-plus-fill fs-3"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">Create Researcher Account</h4>
      <p class="text-muted small mb-0">Join ResearchMate Academic Workspace</p>
    </div>

    <div class="auth-body">
      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show small py-2 mb-3" role="alert">
              {{ message }}
              <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="row g-2 mb-3">
          <div class="col-sm-6">
            <label for="full_name" class="form-label fw-semibold small text-secondary">Full Name</label>
            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Dr. Jane Smith" required>
          </div>
          <div class="col-sm-6">
            <label for="institution" class="form-label fw-semibold small text-secondary">Institution / University</label>
            <input type="text" class="form-control" id="institution" name="institution" placeholder="University / College" required>
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-sm-6">
            <label for="username" class="form-label fw-semibold small text-secondary">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="janesmith" required>
          </div>
          <div class="col-sm-6">
            <label for="email" class="form-label fw-semibold small text-secondary">Academic Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="jane@univ.edu" required>
          </div>
        </div>

        <div class="row g-2 mb-4">
          <div class="col-sm-6">
            <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Min 6 characters" required>
          </div>
          <div class="col-sm-6">
            <label for="confirm_password" class="form-label fw-semibold small text-secondary">Confirm Password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3 shadow-sm">
          <i class="bi bi-check-circle me-1"></i> Register & Enter Workspace
        </button>
      </form>

      <div class="text-center pt-2 border-top">
        <small class="text-muted">
          Already registered?
          <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
        </small>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
